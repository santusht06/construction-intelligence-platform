<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Multimodal Construction Intelligence Platform | Santusht Kotai</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      .loader-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 40px;
        max-width: 520px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      }
      .spinner {
        width: 52px;
        height: 52px;
        border: 4px solid rgba(245, 158, 11, 0.2);
        border-top: 4px solid #f59e0b;
        border-radius: 50%;
        animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        margin: 0 auto 24px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.45rem;
        margin: 0 0 8px 0;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .creator-badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #fbbf24;
        padding: 5px 14px;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 16px;
      }
      p.desc {
        color: #94a3b8;
        font-size: 0.92rem;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      .progress-bar-container {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
      }
      .progress-bar-fill {
        width: 40%;
        height: 100%;
        background: #f59e0b;
        border-radius: 999px;
        animation: pulse-bar 2s infinite ease-in-out;
      }
      @keyframes pulse-bar {
        0% { width: 15%; margin-left: 0; }
        50% { width: 75%; margin-left: 15%; }
        100% { width: 15%; margin-left: 85%; }
      }
      .status-text {
        color: #64748b;
        font-size: 0.8rem;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="loader-card">
        <div class="spinner"></div>
        <div class="creator-badge">Project by Santusht Kotai</div>
        <h1>🏗️ Construction Intelligence Platform</h1>
        <p class="desc">
          Initializing Pyodide WebAssembly runtime and mounting Streamlit components for real-time safety, defect triage, and site planning.
        </p>
        <div class="progress-bar-container">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="status-text" id="status-text">Downloading Python & Streamlit WASM environment...</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      const statusText = document.getElementById("status-text");

      Promise.all([
        fetch("./app.py").then((r) => {
          if (!r.ok) throw new Error("Could not load app.py");
          return r.text();
        }),
        fetch("./config.toml")
          .then((r) => (r.ok ? r.text() : ""))
          .catch(() => "")
      ])
        .then(([appCode, configToml]) => {
          statusText.innerText = "Mounting Streamlit application...";
          const files = {
            "app.py": appCode,
          };
          if (configToml) {
            files[".streamlit/config.toml"] = configToml;
          }

          mount(
            {
              requirements: ["pillow"],
              entrypoint: "app.py",
              files: files,
            },
            document.getElementById("root")
          );

          // Once Streamlit root has rendered elements, fade out loader
          const checkReady = setInterval(() => {
            const root = document.getElementById("root");
            if (root && root.children.length > 0) {
              const loader = document.getElementById("loader");
              if (loader) {
                loader.style.transition = "opacity 0.4s ease";
                loader.style.opacity = "0";
                setTimeout(() => loader.remove(), 400);
              }
              clearInterval(checkReady);
            }
          }, 300);
        })
        .catch((err) => {
          statusText.innerText = "Error: " + err.message;
          statusText.style.color = "#f87171";
        });
    </script>
  </body>
</html>
